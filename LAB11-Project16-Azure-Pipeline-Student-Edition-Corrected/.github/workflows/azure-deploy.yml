
name: LAB11 Project16 Azure Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select deployment environment'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    defaults:
      run:
        shell: bash
        working-directory: 'LAB 11 — ARM & Bicep Infrastructure as Code/LAB11-Project16-Azure-Application-Deployment-Pipeline'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Script Permissions
        run: |
          chmod +x scripts/*.sh
          ls -l scripts/

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Bicep
        run: |
          az bicep install
          bash scripts/validate.sh "${{ inputs.environment }}"

      - name: Deploy Azure Infrastructure
        env:
          LOCATION: centralindia
          AUTO_APPROVE: "true"
        run: |
          bash scripts/deploy.sh "${{ inputs.environment }}"

      - name: Deploy Application
        run: |
          bash scripts/deploy-app.sh "${{ inputs.environment }}"

      - name: Verify Deployment
        run: |
          bash scripts/verify.sh "${{ inputs.environment }}"
